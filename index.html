<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2e7d32" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="favicon-192.png" />
    <title>Projeto-Rotina</title>
  </head>
  <body>
    <header>
      <section class="header-container">
        <div class="horaAtual">
          <h1 id="date"></h1>
        </div>
        <div class="Hora">
          <h2 id="horas"></h2>
        </div>
        <div class="logo"></div>
      </section>
    </header>
    <main>
      <div class="main-container">
        <h2>Adicione Suas <span>Atividades</span></h2>
        <button id="btn-addAtividade" class="botao-adicionar">+</button>
      </div>
    </main>
    <div id="listaTarefas"></div>
    <div class="text-area">
      <h2>detalhes <span> do dia</span></h2>

      <textarea
        name="detalhes do dia"
        id="reflexao"
        placeholder="detalhes do seu dia."
      ></textarea>

      <button class="botao" onclick="salvarReflexao()">Salvar Texto</button>
    </div>

   <script src="script.js"></script>
  </body>
</html>
