<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Rotina</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="pagina-auth">
    <div class="cartao-auth">
      <h1 class="marca">Rotina</h1>
      <p class="subtitulo">Entre para ver as tarefas de hoje.</p>

      <p class="mensagem-erro" id="erro" role="alert"></p>

      <form id="formLogin">
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="current-password" required>
        </div>
        <button class="botao" type="submit">Entrar</button>
      </form>

      <p class="troca-auth">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
